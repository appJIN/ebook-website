<!DOCTYPE html>
<html lang="bn" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>পেজ খুঁজে পাওয়া যায়নি — JINBOOK</title>
  <meta name="description" content="আপনি যে পেজটি খুঁজছেন তা পাওয়া যায়নি। JINBOOK হোম পেজে ফিরে যান।" />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>📚</text></svg>" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap" /></noscript>

  <style>
    /* ============================================
       JINBOOK 404 Page — Dark Glassmorphism
    ============================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent-primary:   #7c5cfc;
      --accent-secondary: #00d4aa;
      --accent-warm:      #ff6b6b;
      --bg-primary:       #0a0a1a;
      --bg-glass:         rgba(255,255,255,0.05);
      --border-glass:     rgba(255,255,255,0.08);
      --text-primary:     #f0f0f8;
      --text-muted:       rgba(240,240,248,0.45);
      --gradient-primary: linear-gradient(135deg, #7c5cfc 0%, #00d4aa 100%);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Hind Siliguri', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- Animated Background Orbs ---- */
    .bg-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.10;
      animation: float 22s ease-in-out infinite;
      will-change: transform;
    }
    .orb:nth-child(1) { width: 450px; height: 450px; background: var(--accent-primary); top: -150px; right: -100px; animation-delay: 0s; }
    .orb:nth-child(2) { width: 380px; height: 380px; background: var(--accent-secondary); bottom: -120px; left: -100px; animation-delay: -8s; }
    .orb:nth-child(3) { width: 300px; height: 300px; background: var(--accent-warm); top: 50%; left: 45%; animation-delay: -15s; }

    @keyframes float {
      0%,100% { transform: translate3d(0,0,0) scale(1); }
      33%      { transform: translate3d(20px,-20px,0) scale(1.04); }
      66%      { transform: translate3d(-15px,15px,0) scale(0.97); }
    }

    /* ---- Main Card ---- */
    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 60px 48px;
      max-width: 560px;
      width: calc(100% - 40px);
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 48px rgba(0,0,0,0.5), 0 0 60px rgba(124,92,252,0.08);
      animation: slideUp 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ---- 404 Big Number ---- */
    .error-number {
      font-family: 'Inter', sans-serif;
      font-size: clamp(6rem, 20vw, 9rem);
      font-weight: 700;
      line-height: 1;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -4px;
      margin-bottom: 8px;
      animation: glitch 4s ease-in-out infinite;
    }

    @keyframes glitch {
      0%,90%,100% { filter: none; transform: none; }
      92%  { filter: hue-rotate(20deg); transform: skewX(-1deg); }
      94%  { filter: hue-rotate(-20deg); transform: skewX(1deg); }
      96%  { filter: none; transform: none; }
    }

    /* Book emoji floating */
    .book-emoji {
      font-size: 3.5rem;
      display: block;
      margin-bottom: 16px;
      animation: bounce 2.5s ease-in-out infinite;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }

    /* ---- Text ---- */
    .error-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .error-desc {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 36px;
      max-width: 380px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ---- Buttons ---- */
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 36px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: 'Hind Siliguri', sans-serif;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #7c5cfc, #5a3de8);
      color: white;
      box-shadow: 0 4px 15px rgba(124,92,252,0.35);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #8d70ff, #7c5cfc);
      box-shadow: 0 6px 25px rgba(124,92,252,0.5);
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-primary);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .btn-outline:hover {
      background: rgba(255,255,255,0.08);
      border-color: var(--accent-primary);
      transform: translateY(-2px);
    }

    /* ---- Auto-redirect countdown ---- */
    .redirect-info {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .countdown-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
    }

    .progress-ring {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }
    .ring-track {
      fill: none;
      stroke: rgba(124,92,252,0.15);
      stroke-width: 2;
    }
    .ring-fill {
      fill: none;
      stroke: var(--accent-primary);
      stroke-width: 2;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear;
    }

    .countdown-num {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--accent-primary);
      position: relative;
      z-index: 1;
    }

    /* ---- Quick links ---- */
    .quick-links {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border-glass);
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .quick-link {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .quick-link:hover { color: var(--accent-secondary); }

    /* ---- JINBOOK brand top ---- */
    .brand {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.4rem;
      font-weight: 700;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
      white-space: nowrap;
    }

    @media (max-width: 480px) {
      .card { padding: 44px 24px; }
      .btn-group { flex-direction: column; align-items: center; }
      .btn { width: 100%; justify-content: center; }
      .quick-links { gap: 16px; }
    }
  </style>
</head>
<body>

  <!-- Background Orbs -->
  <div class="bg-particles" aria-hidden="true">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <!-- Brand Logo at top -->
  <a href="index.html" class="brand" aria-label="JINBOOK হোম পেজে ফিরুন">
    📚 JINBOOK
  </a>

  <!-- Error Card -->
  <main class="card" id="main-content" role="main">

    <span class="book-emoji" aria-hidden="true">📖</span>

    <div class="error-number" aria-label="Error 404">404</div>

    <h1 class="error-title">পেজটি খুঁজে পাওয়া যায়নি!</h1>

    <p class="error-desc">
      আপনি যে পেজটি খুঁজছেন সেটি সরানো হয়েছে, নাম পরিবর্তন হয়েছে,
      অথবা কখনো ছিল না। চিন্তা করবেন না — আমাদের বইগুলো এখনও আছে! 📚
    </p>

    <div class="btn-group">
      <a href="index.html" class="btn btn-primary" id="home-btn">
        🏠 হোম পেজে ফিরুন
      </a>
      <a href="index.html#books" class="btn btn-outline" id="books-btn">
        📚 বই দেখুন
      </a>
    </div>

    <!-- Auto-redirect countdown -->
    <div class="redirect-info" id="redirect-info" aria-live="polite">
      <span>স্বয়ংক্রিয়ভাবে হোমে ফিরবেন</span>
      <div class="countdown-wrap">
        <svg class="progress-ring" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
          <circle class="ring-track" cx="16" cy="16" r="13" />
          <circle class="ring-fill" id="ring-fill" cx="16" cy="16" r="13" />
        </svg>
        <span class="countdown-num" id="countdown">10</span>
      </div>
      <span>সেকেন্ডে</span>
    </div>

    <!-- Quick navigation links -->
    <nav class="quick-links" aria-label="দ্রুত নেভিগেশন">
      <a href="index.html#about"   class="quick-link">লেখক পরিচিতি</a>
      <a href="index.html#contact" class="quick-link">যোগাযোগ</a>
      <a href="index.html#books"   class="quick-link">সব বই</a>
    </nav>

  </main>

  <script>
    // ============================================
    // Auto-redirect countdown with SVG progress ring
    // ============================================
    (function () {
      const TOTAL = 10;
      const r = 13;
      const circumference = 2 * Math.PI * r; // ~81.68

      const ring     = document.getElementById('ring-fill');
      const countEl  = document.getElementById('countdown');

      ring.style.strokeDasharray  = circumference;
      ring.style.strokeDashoffset = 0;

      let remaining = TOTAL;
      let cancelled = false;

      const timer = setInterval(() => {
        if (cancelled) return;
        remaining--;
        countEl.textContent = remaining;

        // Animate ring clockwise (offset increases)
        ring.style.strokeDashoffset = circumference * (1 - remaining / TOTAL);

        if (remaining <= 0) {
          clearInterval(timer);
          window.location.href = 'index.html';
        }
      }, 1000);

      // Cancel auto-redirect on any button/link click
      document.querySelectorAll('.btn, .quick-link').forEach(el => {
        el.addEventListener('click', () => {
          cancelled = true;
          clearInterval(timer);
          const info = document.getElementById('redirect-info');
          if (info) info.style.display = 'none';
        });
      });
    })();
  </script>

</body>
</html>
